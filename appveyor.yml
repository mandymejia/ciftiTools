image: Visual Studio 2022
platform: x64

environment:
  global:
    NOT_CRAN: true
    R_REMOTES_STANDALONE: true
  matrix:
    - R_VERSION: release
      R_ARCH: x64

init:
  ps: |
    $ErrorActionPreference = "Stop"
    Get-Date

install:
  ps: |
    $ErrorActionPreference = "Stop"
    if (-not (Test-Path r-appveyor-scripts)) {
      New-Item -ItemType Directory -Force -Path r-appveyor-scripts | Out-Null
    }
    if (-not (Test-Path r-appveyor-scripts/appveyor-tool.ps1)) {
      Invoke-WebRequest -UseBasicParsing `
        -Uri "https://raw.githubusercontent.com/krlmlr/r-appveyor/master/scripts/appveyor-tool.ps1" `
        -OutFile "r-appveyor-scripts/appveyor-tool.ps1"
    }
    Import-Module .\r-appveyor-scripts\appveyor-tool.ps1
    Bootstrap

cache:
  - C:\RLibrary

# Override automatic MSBuild detection; an RStudio .Rproj file is not MSBuild XML.
build_script:
  - travis-tool.sh install_deps

test_script:
  - travis-tool.sh run_tests

on_failure:
  - 7z a failure.zip *.Rcheck\*
  - appveyor PushArtifact failure.zip

artifacts:
  - path: '*.Rcheck\**\*.log'
    name: Logs
  - path: '*.Rcheck\**\*.out'
    name: Logs
  - path: '*.Rcheck\**\*.fail'
    name: Logs
  - path: '*.Rcheck\**\*.Rout'
    name: Logs
  - path: '\*_*.zip'
    name: Bits
